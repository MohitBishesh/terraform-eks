# Default values for web-application.
# Sized for EKS nodes: t3.medium (2 vCPU / 4 GiB), 2 nodes, shared with
# system add-ons (CoreDNS, kube-proxy, vpc-cni, ebs-csi). Keep requests low
# so both replicas schedule cleanly; limits cap noisy neighbors.

replicaCount: 2

image:
  repository: mohitbishesh/hello-world
  tag: main
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Extra labels applied to Deployment, Service, and Pods (in addition to
# standard app.kubernetes.io/* selector labels).
commonLabels:
  app: web-application
  workload.type: worker-webapp
  project: devops-take-home
  owner: mohit-bishesh

podLabels:
  app: web-application
  workload.type: worker-webapp
  tier: frontend

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080

# Per-pod budget (x2 replicas ≈ 200m CPU / 256Mi requested cluster-wide).
# t3.medium allocatable is roughly ~1930m CPU / ~3.2Gi after kube/system reserve.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 400m
    memory: 256Mi

# Must match Terraform managed node group labels.
nodeSelector:
  workload.type: worker-webapp
  role: worker

# Health checks against Flask /healthz (plain text "ok").
startupProbe:
  httpGet:
    path: /healthz
    port: http
  failureThreshold: 12
  periodSeconds: 5
  timeoutSeconds: 3

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 0
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
  successThreshold: 1

podAnnotations: {}

# Scraped by kube-prometheus-stack after the monitoring stack is installed.
# Requires app image that exposes GET /metrics (prometheus-client).
serviceMonitor:
  enabled: true
  path: /metrics
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

serviceAccount:
  create: false
  name: ""
