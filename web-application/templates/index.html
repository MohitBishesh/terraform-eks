<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
    <span class="grid"></span>
  </div>

  <main class="stage">
    <p class="eyebrow">Mohit Bishesh</p>
    <h1 class="title" aria-label="Hello World">
      <span class="word" data-word="Hello">Hello</span>
      <span class="word accent" data-word="World">World</span>
    </h1>
    <p class="lede">
      Built by Mohit Bishesh — a small Python service running toward Kubernetes.
    </p>
    <div class="actions">
      <a class="btn" href="/api/hello">Plain text API</a>
      <button type="button" class="btn ghost" id="pulse-btn">Pulse again</button>
    </div>
    <p class="meta">
      <span class="dot"></span>
      live · port 8080 · <code>/healthz</code>
    </p>
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
